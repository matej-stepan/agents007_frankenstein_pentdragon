[project]
name = "taltempla"
version = "0.1.0"
description = "Module A: the Taltempla CLI (agent loop, meter, gates)"
requires-python = "==3.13.*"
dependencies = ["rich>=13", "prompt_toolkit>=3.0.47"]

[project.scripts]
taltempla = "taltempla.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["taltempla"]
